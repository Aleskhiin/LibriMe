openapi: 3.0.3
info:
  title: LibriMe API
  description: API zum Vertonen von PDFs und Bildern (OCR + TTS)
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Lokaler Entwicklungsserver

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health Check
      description: Prüft, ob der Backend-Service läuft.
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: "LibriMe Backend is running!"

  /jobs:
    get:
      summary: Alle Jobs des Benutzers abrufen
      description: Gibt eine Liste aller Jobs zurück, die der aktuell authentifizierte Benutzer erstellt hat.
      operationId: getAllJobs
      responses:
        '200':
          description: Liste der Jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatusJobRecord'
    post:
      summary: Einen neuen Vertonungs-Job erstellen
      description: Lädt ein PDF oder Bild hoch, um es in Audio umzuwandeln.
      operationId: createJob
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Das PDF oder Bild (png/jpg)
                fileLanguage:
                  $ref: '#/components/schemas/LanguageType'
                translationLanguage:
                  $ref: '#/components/schemas/LanguageType'
                voiceID:
                  $ref: '#/components/schemas/VoiceType'
                splittingID:
                  $ref: '#/components/schemas/SplittingType'
              required:
                - file
                - fileLanguage
                - translationLanguage
                - voiceID
                - splittingID
      responses:
        '202':
          description: Akzeptiert. Die Verarbeitung hat begonnen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewJobRecord'
        '400':
          description: Ungültige Eingabe
        '401':
          description: Nicht authentifiziert

  /jobs/{jobID}:
    get:
      summary: Status eines Jobs abrufen
      description: Gibt den aktuellen Status und Fortschritt eines Jobs zurück.
      operationId: getJobStatus
      parameters:
        - name: jobID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Aktueller Status des Jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusJobRecord'
        '401':
          description: Nicht authentifiziert
        '403':
          description: Nicht autorisiert (Job gehört einem anderen Benutzer)
        '404':
          description: Job nicht gefunden

    put:
      summary: Job-Status aktualisieren (Intern/Worker)
      description: Wird von der AI-Komponente verwendet, um den Fortschritt und Status zu aktualisieren.
      operationId: updateJobStatus
      security: [] # In SecurityConfig.java als permitAll konfiguriert
      parameters:
        - name: jobID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/StatusType'
        - name: progress
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: outputFilePath
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job erfolgreich aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusJobRecord'
        '404':
          description: Job nicht gefunden

  /jobs/{jobID}/result:
    get:
      summary: Die fertige Audiodatei herunterladen
      description: Gibt die Audiodatei zurück oder leitet zu einer externen URL weiter.
      operationId: getJobResult
      parameters:
        - name: jobID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Die Audiodatei
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '302':
          description: Weiterleitung zur Download-URL (z.B. GCS Signed URL)
        '401':
          description: Nicht authentifiziert
        '403':
          description: Nicht autorisiert
        '404':
          description: Job nicht gefunden oder Ergebnis nicht verfügbar

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    NewJobRecord:
      type: object
      properties:
        jobID:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/StatusType'
        message:
          type: string
        StatusURL:
          type: string
          description: Link zur Statusabfrage

    StatusJobRecord:
      type: object
      properties:
        jobID:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/StatusType'
        progress:
          type: integer
        downloadURL:
          type: string
        error:
          type: string

    StatusType:
      type: string
      enum:
        - QUEUED
        - RUNNING
        - COMPLETED
        - FAILED

    LanguageType:
      type: string
      enum:
        - en_US

    VoiceType:
      type: string
      enum:
        - male_v1

    SplittingType:
      type: string
      enum:
        - PAGE
        - DOCUMENT
        - PARAGRAPH

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
