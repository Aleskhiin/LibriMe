services:

  flask:
    build:
      context: .
      dockerfile: Dockerfile.flask
    container_name: flask_backend
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=production

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  rabbitmq:
    image: rabbitmq:3-management
    container_name: librime-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-module:
    build:
      context: .
      dockerfile: Dockerfile.rabbitmq
    container_name: librime-ai-module
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
    volumes:
      - librime-files:/opt/librime/files

volumes:
  librime-files: