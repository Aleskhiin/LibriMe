spring.application.name=LibriMeBackend
server.port=8080

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${RABBITMQ_USERNAME:user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:user}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}

spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:3306/libribackendDB}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:test_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cloud SQL Starter Configuration (Active when spring.cloud.gcp.sql.instance-connection-name is set)
spring.cloud.gcp.sql.instance-connection-name=${DB_CONNECTION_NAME:}
spring.cloud.gcp.sql.database-name=${DB_NAME:libribackendDB}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Messaging Configuration
messaging.provider=${MESSAGING_PROVIDER:rabbitmq}
pubsub.topic=${PUBSUB_TOPIC:new-jobs}

# Storage Configuration
storage.provider=${STORAGE_PROVIDER:local}
storage.local-path=${LOCAL_STORAGE_PATH:/opt/librime/files}
gcp.storage.bucket=${GCS_BUCKET_NAME}

# JWT Configuration
jwt.secret=${JWT_SECRET:default_secret_key_that_is_at_least_32_characters_long_for_hs256}
jwt.expiration=${JWT_EXPIRATION:86400000}
